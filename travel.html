// Draggable, zoomable map. The view survives the page re-rendering.
var MAPVIEW = { s: 0, tx: 0, ty: 0, ready: false };
function mapViewAttach(M) {
  var vp = document.querySelector('.map-view');
  var stage = document.querySelector('.map-stage');
  if (!vp || !stage || !M) return;
  var V = MAPVIEW;
  function vw() { return vp.clientWidth; }
  function vh() { return vp.clientHeight; }
  function minS() { return Math.min(vw() / M.w, vh() / M.h); }
  function maxS() { return Math.max(minS() * 1.01, 1.25); }
  function clamp() {
    var w = M.w * V.s, h = M.h * V.s;
    V.tx = w <= vw() ? (vw() - w) / 2 : Math.min(0, Math.max(vw() - w, V.tx));
    V.ty = h <= vh() ? (vh() - h) / 2 : Math.min(0, Math.max(vh() - h, V.ty));
  }
  function apply() {
    clamp();
    stage.style.width = (M.w * V.s) + 'px';
    stage.style.transform = 'translate(' + V.tx + 'px,' + V.ty + 'px)';
  }
  function fitBox(b) {
    V.s = Math.min(vw() / (b[2] - b[0]), vh() / (b[3] - b[1]));
    V.s = Math.max(minS(), Math.min(maxS(), V.s));
    V.tx = vw() / 2 - (b[0] + b[2]) / 2 * V.s;
    V.ty = vh() / 2 - (b[1] + b[3]) / 2 * V.s;
  }
  function zoomAt(f, cx, cy) {
    var ns = Math.max(minS(), Math.min(maxS(), V.s * f));
    V.tx = cx - (cx - V.tx) * ns / V.s;
    V.ty = cy - (cy - V.ty) * ns / V.s;
    V.s = ns; apply();
  }
  if (!V.ready || V.lastW !== vw()) {
    if (!V.ready) fitBox(M.start);
    else { var k = vw() / V.lastW; V.s *= k; V.tx *= k; V.ty *= k; }
    V.ready = true; V.lastW = vw();
  }
  apply();
  vp.querySelector('.map-zoom-in').onclick = function () { zoomAt(1.5, vw() / 2, vh() / 2); };
  vp.querySelector('.map-zoom-out').onclick = function () { zoomAt(1 / 1.5, vw() / 2, vh() / 2); };
  vp.querySelector('.map-zoom-all').onclick = function () { V.s = minS(); apply(); };

    if (count() === 1) { moved = 0; last = { x: e.clientX, y: e.clientY }; }

    }

  });
  vp.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (count() === 2 && pinch) {

      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      zoomAt(d / pinch.d, (p[0].x + p[1].x) / 2 - r.left, (p[0].y + p[1].y) / 2 - r.top);
      pinch.d = d; moved = 99; return;
    }
    if (count() === 1 && last) {
      var dx = e.clientX - last.x, dy = e.clientY - last.y;
      moved += Math.abs(dx) + Math.abs(dy);

      V.tx += dx; V.ty += dy; last = { x: e.clientX, y: e.clientY }; apply();
    }
  });

    delete pts[e.pointerId];
    if (count() < 2) pinch = null;
    if (count() === 1) { var p = Object.values(pts)[0]; last = { x: p.x, y: p.y }; }
    if (count() === 0) { last = null; vp.style.cursor = 'grab'; }
  }
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);
  vp.addEventListener('click', function (e) { if (moved > 6) { e.stopPropagation(); e.preventDefault(); } moved = 0; }, true);

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { map: 'greece', place: null };
  }
  componentDidMount() {
    var self = this;
    function openFromLink() {
      var m = /^#map-(.+)$/.exec(window.location.hash);
      if (!m) return;
      var found = PLACES.filter(function (p) { return p.id === m[1]; })[0];
      if (!found) return;
      self.setState({ map: found.map, place: found.id });
      var mapSection = document.getElementById('map');
      if (mapSection) mapSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    window.addEventListener('hashchange', openFromLink);
    openFromLink();
  }
  renderVals() {
    var self = this;
    Promise.resolve().then(function () { mapViewAttach(MAPS[self.state.map]); });
    var map = this.state.map;
    var current = null;
    PLACES.forEach(function (p) { if (p.id === self.state.place) current = p; });
    var place = null;
    if (current) {
      place = {
        name: current.name,
        region: current.region,
        blurb: current.blurb,
        countLabel: current.videos.length === 0 ? '' : (current.videos.length === 1 ? '1 video from here' : current.videos.length + ' videos from here'),
        blogs: (current.blogs || []).map(function (b) { return { url: b.url, label: 'Read our blog: ' + b.title + ' →' }; }),
        hasBlogs: !!(current.blogs && current.blogs.length),
        videos: current.videos.map(function (key) {
          var isShort = key.indexOf('short:') === 0;
          var id = isShort ? key.slice(6) : key;
          return {
            url: isShort ? 'https://www.youtube.com/shorts/' + id : 'https://www.youtube.com/watch?v=' + id,
            title: V[key][0],
            thumb: 'images/' + V[key][1] + '.jpg'
          };
        })
      };
    }
    return {
      mapW: MAPS[map].w,
      mapH: MAPS[map].h,
      mapSrc: MAPS[map].src,
      mapAlt: MAPS[map].alt,
      pins: PLACES.filter(function (p) { return p.map === map; }).map(function (p) {
        var sel = !!current && p.id === current.id;
        return {
          x: p.x, y: p.y, home: !!p.home, selected: sel && !p.home, unselected: !sel && !p.home,
          aria: p.jump ? 'Show the Greece map' : (p.home ? 'Show our home, the East Midlands' : 'Show videos from ' + p.name),
          pick: function () {
            if (p.jump) { self.setState({ map: p.jump, place: null }); }
            else { self.setState({ place: p.id }); }
          }
        };
      }),
      hasLabel: !!current,
      labelX: current ? current.x : 0,
      labelY: current ? current.y : 0,
      labelText: current ? current.name : '',
      noPlace: !current,
      hasPlace: !!current,
      place: place || { name: '', region: '', blurb: '', countLabel: '', videos: [], blogs: [], hasBlogs: false },
      clearPlace: function () { self.setState({ place: null }); }
    };
  }
}
