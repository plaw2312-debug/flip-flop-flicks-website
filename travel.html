    </div>
  </section>

            <span aria-hidden="true" style="position: absolute; left: {{labelX}}%; top: {{labelY}}%; transform: translate(-50%, -150%); background: #1F2A44; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 4px; white-space: nowrap; pointer-events: none">{{labelText}}</span>

            <li><strong>Corfu to Parga</strong> · Syvota, Nafpaktos</li>
            <li><strong>The Mani</strong> · Limeni, Kardamyli, Stoupa</li>
            <li><strong>Islands &amp; Corinth</strong> · Hydra, Spetses, the canal</li>
            <li><strong>Meteora</strong> · monasteries in the sky</li>
            <li><strong>Back to Corfu</strong> · Kassiopi, Paleokastritsa</li>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { map: 'greece', place: null };
  }
  renderVals() {
    var self = this;
    var map = this.state.map;
    var current = null;
    PLACES.forEach(function (p) { if (p.id === self.state.place) current = p; });
    var place = null;
    if (current) {
      place = {
        name: current.name,
        region: current.region,
        blurb: current.blurb,
        countLabel: current.videos.length === 1 ? '1 video from here' : current.videos.length + ' videos from here',
        videos: current.videos.map(function (key) {
          var isShort = key.indexOf('short:') === 0;
          var id = isShort ? key.slice(6) : key;
          return {
            url: isShort ? 'https://www.youtube.com/shorts/' + id : 'https://www.youtube.com/watch?v=' + id,
            title: V[key][0],
            thumb: 'images/' + V[key][1] + '.jpg'
          };
        })
      };
    }
    return {
      mapSrc: MAPS[map].src,
      mapAlt: MAPS[map].alt,
      pins: PLACES.filter(function (p) { return p.map === map; }).map(function (p) {
        var sel = !!current && p.id === current.id;
        return {
          x: p.x, y: p.y, home: !!p.home, selected: sel && !p.home, unselected: !sel && !p.home,
          aria: p.jump ? 'Show the Greece map' : (p.home ? 'Show our home, the East Midlands' : 'Show videos from ' + p.name),
          pick: function () {
            if (p.jump) { self.setState({ map: p.jump, place: null }); }
            else { self.setState({ place: p.id }); }
          }
        };
      }),
      hasLabel: !!current,
      labelX: current ? current.x : 0,
      labelY: current ? current.y : 0,
      labelText: current ? current.name : '',
      noPlace: !current,
      hasPlace: !!current,
      place: place || { name: '', region: '', blurb: '', countLabel: '', videos: [] },
      clearPlace: function () { self.setState({ place: null }); }
    };
  }
}
