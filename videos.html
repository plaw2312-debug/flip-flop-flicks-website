];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    var current = this.state.filter;
    var self = this;
    var shown = VIDEOS.filter(function (v) { return current === 'all' || v.cat === current; });
    return {
      filters: FILTERS.map(function (f) {
        return { label: f.label, active: f.id === current, inactive: f.id !== current, pick: function () { self.setState({ filter: f.id }); } };
      }),
      videos: shown.map(function (v) {
        return {
          url: 'https://www.youtube.com/watch?v=' + v.id,
          thumb: v.thumb,
          title: v.title,
          blurb: v.blurb,
          dur: v.dur,
          tag: TAGS[v.cat],
          meta: v.views + ' views · ' + v.age + ' · ' + v.dur,
          watchLabel: 'Watch ' + v.title + ' on YouTube'
        };
      }),
      countLabel: shown.length === 1 ? '1 video' : shown.length + ' videos'
    };
